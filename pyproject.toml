[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "watermark-lab"
version = "0.1.0"
description = "Research tooling for evaluating a self-owned text watermark scheme"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Watermark Lab contributors" }]
dependencies = [
  "fastapi>=0.110,<1",
  "pydantic>=2,<3",
]

[project.optional-dependencies]
ml = [
  "transformers>=4.40,<5",
  "torch>=2.1,<3",
]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
  "ruff>=0.6,<1",
]

[project.scripts]
watermark-lab = "watermark_lab.cli:main"

[tool.setuptools.packages.find]
include = ["watermark_lab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I"]
